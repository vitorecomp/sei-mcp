[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sei-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server in Python for the Brazilian SEI (Sistema Eletrônico de Informações) SOAP Web Services, built for Gemini Enterprise."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Vitor Vieira" }
]
keywords = ["sei", "mcp", "gemini-enterprise", "soap", "wsdl", "govbr", "processo-eletronico"]
dependencies = [
  "lxml>=5.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "zeep>=4.2.1",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "google-auth>=2.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
sei-mcp-server = "src.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
